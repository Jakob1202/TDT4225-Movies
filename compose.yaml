services:
  mongodb:
    image: mongo:7.0.1
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set this in .env}
      MONGO_INITDB_DATABASE: movies
      MONGO_USER: movies
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Set this in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  mongo_data:
